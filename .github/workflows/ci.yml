name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The server's tests and the binary build run on Bun directly, not through Vite+.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
      - name: Smoke-test the binary
        run: |
          export RUNYARD_DATA_DIR="$RUNNER_TEMP/runyard" RUNYARD_PORT=7420
          apps/cli/dist/runyard &
          for _ in $(seq 20); do curl -sf localhost:7420/api/health && break; sleep 0.5; done
          curl -sf localhost:7420/ | grep -q '<div id="root">'
          kill %1
