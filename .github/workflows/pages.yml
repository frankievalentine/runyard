# Publishes the landing page (site/) and the installers at
# https://frankievalentine.github.io/runyard/, so
# `curl -fsSL https://frankievalentine.github.io/runyard/install.sh | sh` works. The installers
# download the binaries from the latest GitHub Release themselves, so this only redeploys when
# the page, the installers or the preview images change on main (the github-pages environment
# deploys from main only). Needs Pages turned on with GitHub Actions as its source
# (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - install/**
      - apps/dashboard/public/favicon.svg
      - apps/dashboard/public/og.png
      - apps/dashboard/public/og.mp4
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site
        # The landing page, the installers beside it, and the link-preview images the page's
        # Open Graph tags point at, taken from the dashboard so there is one copy of each.
        run: |
          mkdir _site
          cp -R site/. _site/
          cp install/install.sh install/install.ps1 _site/
          cp apps/dashboard/public/favicon.svg apps/dashboard/public/og.png apps/dashboard/public/og.mp4 _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
